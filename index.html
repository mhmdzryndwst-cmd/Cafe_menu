<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21170f"><meta name="description" content="منوی آنلاین کافه سنتی">
<title>منوی کافه سنتی</title>

<style>
:root {
  --bg: #100d0a;
  --panel: #211810;
  --panel2: #302116;
  --gold: #dfbb75;
  --cream: #f8efdf;
  --muted: #c0a98a;
  --line: #60472c;
  --gold-light: #f2dba8;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--cream);
  font-family: Tahoma, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #49301b 0%, transparent 45%),
    radial-gradient(ellipse at bottom, #24170e 0%, var(--bg) 70%);
}

header {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 38px 16px 30px;
  border-bottom: 1px solid var(--gold);
  background:
    linear-gradient(135deg, #28190fef, #120d09f7),
    repeating-linear-gradient(45deg, transparent 0 20px, #dfbb7508 20px 21px);
}

header::before,
header::after {
  content: "✦";
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #dfbb7555;
  font-size: 65px;
  pointer-events: none;
}

header::before { right: 5%; }
header::after { left: 5%; }

.mark {
  font-size: 37px;
  color: var(--gold);
  text-shadow: 0 0 25px #dfbb7540;
}

h1 {
  margin: 12px 0;
  font-size: clamp(27px, 6vw, 39px);
  line-height: 1.5;
  color: var(--gold-light);
  text-shadow: 0 3px 20px #000;
}

header p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: .3px;
}

.wrap {
  max-width: 850px;
  margin: auto;
  padding: 20px 15px 55px;
}

.tools {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 13px 0 10px;
  background: #100d0af2;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #60472c66;
}

input, select, button {
  font: inherit;
}

#search {
  width: 100%;
  padding: 15px 17px;
  color: var(--cream);
  background: linear-gradient(135deg, #2a1e14, #19120d);
  border: 1px solid var(--line);
  border-radius: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

#search:focus,
#admin input:focus,
#admin select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #dfbb7518;
}

#search::placeholder {
  color: #b9a58b99;
}

.cats {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 13px 1px 5px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

.cat {
  flex-shrink: 0;
  white-space: nowrap;
  padding: 10px 15px;
  color: var(--cream);
  background: linear-gradient(145deg, #2b2017, #19120d);
  border: 1px solid var(--line);
  border-radius: 30px;
  cursor: pointer;
  transition: .2s ease;
}

.cat:active {
  transform: scale(.96);
}

.cat.active {
  color: #20150b;
  font-weight: bold;
  background: linear-gradient(135deg, #f0d59b, #c89b4e);
  border-color: var(--gold);
  box-shadow: 0 3px 14px #dfbb7525;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 2px 13px;
  color: var(--gold);
  font-size: 19px;
  font-weight: bold;
}

.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(to left, var(--line), transparent);
}

.item {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 10px 0;
  padding: 15px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(115deg, #291d13, #1a120d 75%);
  border: 1px solid #60472c;
  border-radius: 16px;
  box-shadow: 0 5px 15px #00000018;
  transition: transform .2s, border-color .2s, box-shadow .2s;
}

.item::before {
  content: "";
  position: absolute;
  right: 0;
  top: 15%;
  bottom: 15%;
  width: 3px;
  border-radius: 4px 0 0 4px;
  background: linear-gradient(transparent, var(--gold), transparent);
  opacity: .7;
}

.item:active {
  transform: scale(.99);
}

.emoji {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 49px;
  height: 49px;
  font-size: 27px;
  background: radial-gradient(circle at 30% 20%, #4b3520, #21160e);
  border: 1px solid #75542f;
  border-radius: 14px;
}

.info {
  flex: 1;
  min-width: 0;
}

.name {
  color: var(--cream);
  font-size: 15px;
  font-weight: bold;
  line-height: 1.8;
}

.desc {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

.price {
  flex-shrink: 0;
  max-width: 42%;
  color: var(--gold-light);
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
}

.empty {
  padding: 45px 10px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 16px;
}

.foot {
  margin-top: 35px;
  padding-top: 20px;
  color: var(--muted);
  font-size: 12px;
  line-height: 2;
  text-align: center;
  border-top: 1px solid #60472c66;
}

.adminbtn {
  display: block;
  margin: 24px auto 0;
  padding: 11px 17px;
  color: var(--muted);
  background: #211810;
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: .2s;
}

.adminbtn:hover {
  color: var(--gold);
  border-color: var(--gold);
}

#admin {
  display: none;
  margin-top: 18px;
  padding: 18px;
  background: linear-gradient(145deg, #2b1e13, #17100b);
  border: 1px solid var(--gold);
  border-radius: 17px;
  box-shadow: 0 10px 30px #0003;
}

#admin h2 {
  color: var(--gold);
  font-size: 19px;
}

#admin label {
  display: block;
  margin-top: 8px;
  color: var(--gold-light);
  font-size: 13px;
}

#admin input,
#admin select {
  width: 100%;
  min-width: 0;
  margin: 6px 0 10px;
  padding: 12px;
  color: var(--cream);
  background: #140f0b;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
}

#admin select option {
  color: var(--cream);
  background: #211810;
}

.row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.action {
  padding: 11px 15px;
  color: #21150a;
  font-weight: bold;
  background: linear-gradient(135deg, #f0d59b, #c69a4e);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: filter .2s, transform .2s;
}

.action:hover {
  filter: brightness(1.08);
}

.action:active {
  transform: scale(.98);
}

.secondary {
  color: var(--cream);
  background: #382719;
  border: 1px solid var(--line);
}

.note {
  color: var(--muted);
  font-size: 12px;
  line-height: 2;
}

#adminItems .item {
  padding: 12px;
}

#adminItems .action {
  flex-shrink: 0;
}

button:focus-visible {
  outline: 2px solid var(--gold-light);
  outline-offset: 3px;
}

@media (min-width: 600px) {
  .wrap {
    padding-right: 22px;
    padding-left: 22px;
  }

  .item {
    padding: 17px;
  }

  .item:hover {
    transform: translateY(-2px);
    border-color: var(--gold);
    box-shadow: 0 8px 22px #0003;
  }

  .emoji {
    width: 53px;
    height: 53px;
  }
}

@media (max-width: 380px) {
  .wrap {
    padding-right: 10px;
    padding-left: 10px;
  }

  .item {
    gap: 9px;
    padding: 12px;
  }

  .emoji {
    width: 42px;
    height: 42px;
    font-size: 24px;
  }

  .price {
    font-size: 12px;
  }

  .row {
    grid-template-columns: 1fr;
    gap: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
   </style>
</head>
<body>
<header><div class="mark">❧ ☕ ❧</div><h1 id="cafeTitle">کافه سنتی</h1><p>طعم اصالت، عطر خاطره‌ها</p></header>
<main class="wrap">
<div class="tools"><input id="search" placeholder="جست‌وجو در منو..." aria-label="جست‌وجو"><div class="cats" id="cats"></div></div>
<div id="menu"></div>
<button class="adminbtn" id="adminToggle">مدیریت منو ⚙</button>
<section id="admin"><h2>مدیریت منو</h2>
<p class="note">برای ویرایش مشترک، ابتدا با حساب مدیر وارد شو. تغییرات این بخش در دیتابیس ذخیره می‌شوند و برای مشتریان به‌روزرسانی خواهند شد.</p>
<div id="authBox">
<label>ایمیل مدیر</label><input id="adminEmail" type="email" autocomplete="username" placeholder="ایمیل حساب مدیر">
<label>رمز عبور</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="رمز عبور Supabase">
<button class="action" id="loginBtn">ورود مدیر</button>
<button class="action secondary" id="logoutBtn" style="display:none">خروج</button>
<p class="note" id="authStatus">برای مدیریت باید با حسابی که در Supabase ساختی وارد شوی.</p>
</div>
<div id="editBox" style="display:none">
<label>نام کافه</label><input id="titleInput" placeholder="نام کافه">
<div class="row"><div><label>نام آیتم</label><input id="itemName" placeholder="مثلاً چای زغالی"></div><div><label>قیمت (تومان)</label><input id="itemPrice" type="number" min="0" placeholder="مثلاً 85000"></div></div>
<div class="row"><div><label>دسته‌بندی</label><select id="itemCat"><option>چای و نوشیدنی گرم</option><option>قلیان</option><option>صبحانه</option><option>غذا</option><option>نوشیدنی سرد</option><option>خوراکی و مخلفات</option><option>بستنی</option></select></div><div><label>نماد</label><select id="itemEmoji"><option>🍵</option><option>🫖</option><option>☕</option><option>💨</option><option>🍳</option><option>🍲</option><option>🍢</option><option>🍹</option><option>🍦</option><option>🍰</option><option>🥜</option></select></div></div>
<button class="action" id="addItem">افزودن آیتم</button>
<div id="adminItems"></div>
</div></section>
<div class="foot">برای مشاهده منو نیازی به نصب برنامه نیست</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gmctyluozxfmchhtdfnl.supabase.co";
const SUPABASE_KEY = "sb_publishable_5UOeG8popP8h0hEl8c_Mlw_QusIFUNy";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const defaults=[
{id:1,name:"چای زغالی",cat:"چای و نوشیدنی گرم",price:85000,emoji:"🫖",desc:"چای تازه‌دم با عطر دلنشین"},
{id:2,name:"چای نبات",cat:"چای و نوشیدنی گرم",price:95000,emoji:"🍵",desc:"چای ایرانی همراه نبات"},
{id:3,name:"دمنوش سنتی",cat:"چای و نوشیدنی گرم",price:110000,emoji:"🌿",desc:"ترکیب گیاهی خوش‌عطر"},
{id:4,name:"قلیان میوه‌ای",cat:"قلیان",price:350000,emoji:"💨",desc:"قیمت نمونه؛ قابل تغییر"},
{id:5,name:"املت",cat:"صبحانه",price:180000,emoji:"🍳",desc:"املت گوجه تازه"},
{id:6,name:"نیمرو",cat:"صبحانه",price:160000,emoji:"🍳",desc:"تخم‌مرغ تازه"},
{id:7,name:"کباب کوبیده",cat:"غذا",price:420000,emoji:"🍢",desc:"همراه مخلفات"},
{id:8,name:"جوجه کباب",cat:"غذا",price:460000,emoji:"🍗",desc:"همراه مخلفات"},
{id:9,name:"دوغ محلی",cat:"نوشیدنی سرد",price:90000,emoji:"🥛",desc:"نوشیدنی خنک"},
{id:10,name:"آب معدنی",cat:"نوشیدنی سرد",price:35000,emoji:"💧",desc:""},
{id:11,name:"آجیل و مخلفات",cat:"خوراکی و مخلفات",price:140000,emoji:"🥜",desc:""}
];
let items=defaults, cafeName="کافه سنتی", active="همه", isAdmin=false;
const money=n=>Number(n||0).toLocaleString("fa-IR")+" تومان";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function status(t){document.getElementById("authStatus").textContent=t}
async function loadMenu(){
 const {data,error}=await sb.from("cafe_menu").select("*").eq("active",true).order("sort_order").order("id");
 if(error){
   console.error("Supabase loadMenu error:",error);
   if(isAdmin) status("خطا در خواندن منو از دیتابیس: "+error.message);
   return;
 }
 items=(data||[]).map(x=>({id:x.id,name:x.name,cat:x.category,price:Number(x.price),emoji:x.emoji||"☕",desc:x.description||""}));
 render();
 if(isAdmin) status(items.length ? "منو از دیتابیس بارگذاری شد؛ تعداد آیتم‌ها: "+items.length : "اتصال برقرار است اما دیتابیس آیتم فعالی ندارد. اگر آیتم اضافه کردی، پیام ذخیره‌سازی را بررسی کن.");
}
function render(){
 document.getElementById("cafeTitle").textContent=cafeName;
 const cats=["همه",...new Set(items.map(x=>x.cat))];
 document.getElementById("cats").innerHTML=cats.map(c=>'<button class="cat '+(active===c?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});
 const q=document.getElementById("search").value.trim().toLowerCase();
 const shown=items.filter(x=>(active==="همه"||x.cat===active)&&(x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)||x.desc.toLowerCase().includes(q)));
 let html="",last="";shown.forEach(x=>{if(x.cat!==last){html+='<h2 class="section-title">'+esc(x.cat)+'</h2>';last=x.cat}html+='<article class="item"><div class="emoji">'+esc(x.emoji)+'</div><div class="info"><div class="name">'+esc(x.name)+'</div>'+(x.desc?'<div class="desc">'+esc(x.desc)+'</div>':'')+'</div><div class="price">'+money(x.price)+'</div></article>'});
 document.getElementById("menu").innerHTML=html||'<div class="empty">موردی پیدا نشد.</div>';
 renderAdmin();
}
function renderAdmin(){
 document.getElementById("titleInput").value=cafeName;
 document.getElementById("adminItems").innerHTML=items.map(x=>'<div class="item"><div class="info"><b>'+esc(x.name)+'</b><div class="desc">'+money(x.price)+' · '+esc(x.cat)+'</div></div><button class="action secondary" data-del="'+x.id+'">حذف</button></div>').join("");
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
   if(!isAdmin)return;
   const {error}=await sb.from("cafe_menu").update({active:false,updated_at:new Date().toISOString()}).eq("id",Number(b.dataset.del));
   if(error){status("خطا در حذف: "+error.message);return} await loadMenu();status("آیتم از منوی عمومی پنهان شد.");
 });
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("adminToggle").onclick=()=>{const a=document.getElementById("admin");a.style.display=a.style.display==="block"?"none":"block"};
document.getElementById("loginBtn").onclick=async()=>{
 const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value;
 if(!email||!password){status("ایمیل و رمز عبور را وارد کن.");return}
 status("در حال ورود...");
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){status("ورود ناموفق: "+error.message);return}
 isAdmin=true;document.getElementById("editBox").style.display="block";document.getElementById("logoutBtn").style.display="inline-block";status("وارد شدی؛ اگر سیاست دسترسی مدیر تنظیم نشده باشد، ذخیره‌سازی ممکن است رد شود.");renderAdmin();
};
document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();isAdmin=false;document.getElementById("editBox").style.display="none";document.getElementById("logoutBtn").style.display="none";status("از حساب مدیر خارج شدی.")};
document.getElementById("titleInput").addEventListener("change",e=>{cafeName=e.target.value.trim()||"کافه سنتی";document.getElementById("cafeTitle").textContent=cafeName;status("نام کافه در این نسخه تا زمان تنظیم جدول تنظیمات فقط در همین صفحه دیده می‌شود.")});
document.getElementById("addItem").onclick=async()=>{
 if(!isAdmin)return;
 const name=document.getElementById("itemName").value.trim(),price=Number(document.getElementById("itemPrice").value);
 if(!name||!Number.isFinite(price)||price<0){alert("نام آیتم و قیمت معتبر را وارد کن.");return}
 const row={name,category:document.getElementById("itemCat").value,price,emoji:document.getElementById("itemEmoji").value,description:"",active:true,sort_order:items.length};
 const {error}=await sb.from("cafe_menu").insert(row);
 if(error){status("ذخیره انجام نشد: "+error.message+" — باید سیاست RLS مدیر تنظیم شود.");return}
 document.getElementById("itemName").value="";document.getElementById("itemPrice").value="";await loadMenu();status("آیتم در دیتابیس ذخیره شد.");
};
sb.auth.getSession().then(({data})=>{if(data.session){isAdmin=true;document.getElementById("editBox").style.display="block";document.getElementById("logoutBtn").style.display="inline-block";status("وارد حساب مدیر هستی.")}});
sb.auth.onAuthStateChange((_event,session)=>{isAdmin=!!session;document.getElementById("editBox").style.display=isAdmin?"block":"none";document.getElementById("logoutBtn").style.display=isAdmin?"inline-block":"none"});
render();loadMenu();
</script>
</body></html>
